---
layout: layouts/base.html
---
<section class="px-6 lg:px-8 py-24 sm:py-32">
    <div class="mx-auto max-w-2xl text-center">
        <h2 class="text-4xl font-semibold tracking-tight text-balance sm:text-5xl">Contact Us</h2>
        <p class="mt-2 text-lg/8">Fill out the form below to get in touch with us.</p>
    </div>
    <form action="" method="POST" class="mx-auto mt-16 max-w-xl sm:mask-t-from-20">
        <div class="grid grid-cols-1 gap-x-8 gap-y-6 sm:grid-cols-2">
            <div>
                <label for="first-name" class="block text-sm/6 font-semibold">First Name</label>
                <div class="mt-2 5">
                    <input id="first-name" type="text" name="first-name" autocomplete="given-name" class="block w-full rounded-md px-3.5 py-2 text-base outline-1 -outline-offset-1 focus:outline-2 focus:-outline-offset-2">
                </div>
            </div>
            <div class="sm:col-span-2">
                <label for="email" class="block text-sm/6 font-semibold">Email</label>
                <div class="mt-2 5">
                    <input type="email" id="email" autocomplete="email" class="block w-full rounded-md px-3.5 py-2 text-base outline-1 -outline-offset-1 focus:outline-2 focus:-outline-offset-2">
                </div>
            </div>
            <div class="sm:col-span-2">
                <label for="phone-number" class="block text-sm/6 font-semibold">Phone Number</label>
                <div class="mt-2 5">
                    <input type="text" id="phone-number" name="phone-number" placeholder="123-456-7890" class="block min-w-0 grow bg-transparent py-1.5 pr-3 pl-1 text-base focus:outline-none sm:text-sm/6">
                </div>
            </div>
            <div class="sm:col-span-2">
                <label for="message" class="block text-sm/6 font-semibold">Message</label>
                <div class="mt-2 5">
                    <textarea name="message" id="message" rows="4" class="block w-full rounded-md px-3.5 py-2 text-base outline-1 -outline-offset-1 focus:outline-2 focus:-outline-offset-2"></textarea>
                </div>
            </div>
        </div>
    </form>
</section>
