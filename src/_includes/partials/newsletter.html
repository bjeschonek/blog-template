<section class="relative isolate mb-16 lg:mb-24 py-16 sm:py-24 lg:py-32 mx-auto max-w-7xl px-6 lg:px-8 text-center sm:border rounded-2xl">
    <h2 class="text-4xl font-semibold tracking-tight">Subscribe to our newsletter</h2>
    <p class="mt-4 text-lg">Join to get updates on our latest content. No spam.</p>
    <form action="#" method="POST" id="newsletter-form" class="mt-6 flex gap-x-4 justify-center max-w-md mx-auto">
        <label for="email-address" class="sr-only">Email Address</label>
        <input id="newsletter-email-address" type="email" name="email" required placeholder="Enter your email address" autocomplete="email" class="m-w-0 flex-auto rounded-md px-3.5 py-2 text-base outline-1 -outline-offset-1 placeholder:text-gray-500 focus:outline-2 focus:-outline-offset-2 focus:outline-emerald-950 sm:text-sm/6">
        <button id="email-subscribe-btn" type="submit" class="flex-none rounded-md bg-emerald-950 px-3.5 py-2.5 text-sm font-semibold text-white shadow-xs hover:bg-emerald-500 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-neutral-900">Subscribe</button>
    </form>
    <div id="newsletter-message" class="absolute left-1/2 transition motion-reduce:transition-none duration-300 ease-in -translate-x-1/2 maw-w-md mt-4 px-3.5 py-2.5 text-lg font-semibold rounded-md hidden"></div>
</section>
