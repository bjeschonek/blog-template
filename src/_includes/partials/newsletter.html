<section id="newsletter-signup" class="relative isolate mb-16 lg:mb-24 py-16 sm:py-24 lg:py-32 mx-auto max-w-7xl px-6 lg:px-8 text-center sm:border rounded-2xl">
    <h2 class="text-4xl font-semibold tracking-tight">Subscribe to our newsletter</h2>
    <p class="mt-4 text-lg">Join to get updates on our latest content. No spam.</p>
    <form action="#" method="POST" id="newsletter-form" class="mt-6 flex flex-col justify-center max-w-md mx-auto">
        <label for="email-address" class="sr-only">Email Address</label>
        <div class="grid grid-cols-4 gap-x-4">
            <input id="newsletter-email" type="email" name="email" placeholder="Enter your email address..." autocomplete="email" required class="peer col-span-3 min-w-0 flex-auto rounded-md px-3.5 py-2 text-base outline-1 -outline-offset-1 placeholder:text-gray-500 focus:outline-2 focus:-outline-offset-2 focus:outline-neutral-900 sm:text-sm/6 user-invalid:outline-red-700 focus:user-invalid:outline-red-700">
            <button id="newsletter-subscribe-btn" type="submit" class="flex-none rounded-md bg-emerald-950 px-3.5 py-2.5 text-sm font-semibold text-white shadow-xs hover:bg-emerald-500 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-neutral-900 hover:cursor-pointer">Subscribe</button>
            <p class="invisible peer-user-invalid:visible text-red-700 col-span-3 justify-self-start">Please enter a valid email address.</p>
        </div>
        
    </form>
    <div id="newsletter-msg" class="absolute left-1/2 -translate-x-1/2 maw-w-md py-2.5 text-lg font-semibold hidden"></div>
</section>

<section id="newsletter-success" class="relative isolate mb-16 lg:mb-24 py-16 sm:py-24 lg:py-32 mx-auto max-w-7xl px-6 lg:px-8 text-center sm:border rounded-2xl hidden">
    <h2 class="text-4xl font-semibold tracking-tight">Thanks for joining!</h2>
    <p class="mt-4 text-lg">Please check your email to confirm your subscription.</p>
    <button id="newsletter-dismiss" type="button" class="mt-8 rounded-md bg-emerald-950 px-3.5 py-2.5 text-sm font-semibold text-white shadow-xs hover:bg-emerald-500 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-neutral-900 hover:cursor-pointer">Dismiss</button>
</section>
